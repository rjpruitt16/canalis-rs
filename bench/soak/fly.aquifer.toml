# The Aquifer instance behind the two Canalis nodes (q1 in the schedule),
# under the soak supervisor so the driver can kill or hold it. Aquifer has
# had its own soak; here it's the steady thing Canalis hands work to.
# Private network only.
app = "canalis-soak-aquifer-1"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.aquifer"

[env]
  SOAK_DATA_DIR = "/data/run-1"
  DB_PATH = "/data/run-1/aquifer.db"
  AQUIFER_REGISTRY_URL = "http://canalis-soak.internal:8080/register"
  AQUIFER_REGISTRY_INTERVAL_SECONDS = "5"
  # WebSocket transcripts in a local Valkey, as on Aquifer's own soak.
  SOAK_VALKEY = "1"
  SOAK_VALKEY_MAXMEMORY = "600mb"
  AQUIFER_VALKEY_URL = "redis://127.0.0.1:6379"
  AQUIFER_WS_STREAM_MAX_EVENTS = "500"
  AQUIFER_WS_STREAM_TTL_SECONDS = "3600"
  AQUIFER_WS_MAX_CLIENT_CONNECTIONS = "3000"
  AQUIFER_WS_MAX_UPSTREAM_CONNECTIONS = "3000"

[[mounts]]
  source = "aquifer_data"
  destination = "/data"
  initial_size = "5gb"

[[restart]]
  policy = "always"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
